<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="PokeBell sends instant stock alerts straight to your phone the moment the sealed TCG products you want come back in stock across 190+ UK shops."
		/>
		<meta name="theme-color" content="#ca3c25" />

		<!-- Open Graph / social preview -->
		<meta property="og:title" content="PokeBell — Instant TCG stock alerts" />
		<meta
			property="og:description"
			content="Never miss a restock. Get instant app alerts for sealed TCG products across 190+ UK shops."
		/>
		<meta property="og:type" content="website" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
